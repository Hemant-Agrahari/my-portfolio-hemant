[build]
  publish = "."

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/works"
  to = "/#works"
  status = 301
  force = true

# Cache static assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/card/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
